name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_DIRECTUS_URL: ${{ vars.VITE_DIRECTUS_URL }}
      # Optional: the checkout Worker's address. Empty = no Buy buttons on the site.
      VITE_CHECKOUT_ENDPOINT: ${{ vars.VITE_CHECKOUT_ENDPOINT }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Require public Directus URL
        run: |
          if [ -z "$VITE_DIRECTUS_URL" ]; then
            echo "VITE_DIRECTUS_URL repository variable is required"
            exit 1
          fi

      - name: Build site
        run: npm run build

      # The app uses client-side routes (/works/<slug>, ...). GitHub Pages serves 404.html for unknown paths,
      # so a copy of index.html lets a refreshed or shared deep link load the app instead of a 404 page.
      - name: Add SPA fallback for deep links
        run: cp dist/index.html dist/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
